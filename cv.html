            --secondary: #1e293b;
            --accent: #0284c7;
            --text: #334155;

            --bg: #f8fafc;

        .lang-switch {

            padding: 3px;
            border-radius: 8px;

        }

        .lang-btn {

            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            background: transparent;
            color: #64748b;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .lang-btn.active {
            background: #ffffff;
            color: #0284c7;

        }

        .other-cv-link {

            font-weight: 700;
            color: #ea580c;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            background: #fff7ed;
            border: 1px solid #ffedd5;
            transition: all 0.2s ease;
        }
        .other-cv-link:hover { background: #ffedd5; }

        .container { max-width: 960px; margin: 0 auto; background: var(--card-bg); border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.07); overflow: hidden; }

        .profile-img-box {

            height: 125px;

            border: 4px solid #38bdf8;
            object-fit: cover;

            display: flex;
            align-items: center;
            justify-content: center;

        .contact-info { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.88rem; color: #cbd5e1; }

        .experience-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; flex-wrap: wrap; }
        .experience-title { font-size: 1.05rem; font-weight: 700; color: var(--primary); }
        .experience-company { font-weight: 600; color: var(--accent); display: block; }
        .experience-date { font-size: 0.82rem; color: var(--text-light); font-weight: 600; }
        .experience-bullets { padding-left: 16px; font-size: 0.88rem; color: var(--text); margin-top: 6px; }
        .experience-bullets li { margin-bottom: 4px; }

        .module-box strong { color: var(--primary); display: block; font-size: 0.88rem; margin-bottom: 2px; }

        .project-card { background: #f8fafc; border-left: 4px solid var(--accent); padding: 14px 16px; border-radius: 0 8px 8px 0; margin-bottom: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .project-card h3 { font-size: 1.02rem; color: var(--primary); margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }

        .status-freelance { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }

        .project-narrative { font-size: 0.86rem; color: #334155; line-height: 1.5; margin-bottom: 8px; }
        .project-narrative strong { color: var(--primary); }

        .stack-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 10px; font-size: 0.82rem; color: #334155; }
        .stack-box strong { color: var(--primary); }

        .skills-group { margin-bottom: 16px; }
        .skills-group h4 { font-size: 0.9rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .skills-pills { display: flex; flex-wrap: wrap; gap: 6px; }
        .pill { background: #e2e8f0; color: var(--secondary); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .pill-highlight { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .pill-ai { background: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }

        .edu-item { margin-bottom: 12px; }
        .edu-title { font-weight: 700; color: var(--primary); font-size: 0.92rem; }
        .edu-school { font-size: 0.85rem; color: var(--text-light); }
        .edu-date { font-size: 0.8rem; color: var(--accent); font-weight: 600; }

        .lang-item { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 6px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 3px; }

        .btn-print { position: fixed; bottom: 30px; right: 30px; background: #0f172a; color: white; padding: 14px 28px; border-radius: 50px; border: none; cursor: pointer; font-weight: 700; font-size: 0.95rem; box-shadow: 0 10px 25px rgba(15,23,42,0.3); display: inline-flex; align-items: center; gap: 10px; transition: all 0.2s ease; z-index: 1000; text-decoration: none; }
        .btn-print:hover { transform: translateY(-2px); background: #1e293b; }

        @media (max-width: 768px) {
            .top-toolbar { flex-direction: column; gap: 10px; text-align: center; }
            header { flex-direction: column; text-align: center; padding: 30px 20px; }
            .contact-info { justify-content: center; }
            .main-content { grid-template-columns: 1fr; padding: 25px 20px; }
            .modules-grid { grid-template-columns: 1fr; }

        @page { size: A4 portrait; margin: 5mm; }

    </style>
</head>
