<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelson Tobias Parra Moreno | Full Stack Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --net-color: #0284c7;
            --net-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --java-color: #ea580c;
            --java-gradient: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            --text: #334155;
            --text-light: #64748b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.5; padding: 40px 15px; min-height: 100vh; }
        
        .selector-nav {
            max-width: 960px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
        }

        .nav-brand {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .switch-tabs {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
            gap: 4px;
        }

        .tab-btn {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            background: transparent;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .tab-btn.active-net {
            background: #ffffff;
            color: var(--net-color);
            box-shadow: 0 2px 8px rgba(2,132,199,0.15);
        }

        .tab-btn.active-java {
            background: #ffffff;
            color: var(--java-color);
            box-shadow: 0 2px 8px rgba(234,88,12,0.15);
        }

        .container { max-width: 960px; margin: 0 auto; background: var(--card-bg); border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.07); overflow: hidden; }

        header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; padding: 35px 35px; display: flex; align-items: center; gap: 25px; position: relative; }
        
        .profile-img-box {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            object-fit: cover;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            flex-shrink: 0;
            overflow: hidden;
            transition: border-color 0.3s;
        }
        .profile-img-box img { width: 100%; height: 100%; object-fit: cover; }

        .header-title-badge { display: inline-block; background: #38bdf8; color: #0f172a; font-size: 0.8rem; font-weight: 800; padding: 3px 12px; border-radius: 12px; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1.5px; }

        .header-text h1 { font-size: 2.2rem; margin-bottom: 3px; color: #f8fafc; font-weight: 700; letter-spacing: -0.5px; }
        .header-text h2 { font-size: 1.15rem; font-weight: 600; color: #38bdf8; margin-bottom: 12px; }
        .contact-info { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.88rem; color: #cbd5e1; }
        .contact-info span, .contact-info a { color: #cbd5e1; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .contact-info a:hover { color: #38bdf8; }

        .main-content { display: grid; grid-template-columns: 1.85fr 1fr; gap: 30px; padding: 35px; }
        
        .section-title { font-size: 1.15rem; color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }

        .experience-item { margin-bottom: 20px; }
        .experience-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; flex-wrap: wrap; }
        .experience-title { font-size: 1.05rem; font-weight: 700; color: var(--primary); }
        .experience-company { font-weight: 600; color: var(--net-color); display: block; }
        .experience-date { font-size: 0.82rem; color: var(--text-light); font-weight: 600; }
        .experience-bullets { padding-left: 16px; font-size: 0.88rem; color: var(--text); margin-top: 6px; }
        .experience-bullets li { margin-bottom: 4px; }

        .modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .module-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; font-size: 0.84rem; border-left: 3px solid var(--net-color); }
        .module-box strong { color: var(--primary); display: block; font-size: 0.88rem; margin-bottom: 2px; }

        .project-card { background: #f8fafc; border-left: 4px solid var(--net-color); padding: 16px; border-radius: 0 8px 8px 0; margin-bottom: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .project-card h3 { font-size: 1.05rem; color: var(--primary); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
        
        .status-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-freelance { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }

        .project-narrative { font-size: 0.88rem; color: #334155; line-height: 1.55; margin-bottom: 10px; }
        .project-narrative strong { color: var(--primary); }

        .stack-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px 12px; font-size: 0.84rem; color: #334155; }
        .stack-box strong { color: var(--primary); }

        .skills-group { margin-bottom: 16px; }
        .skills-group h4 { font-size: 0.9rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .skills-pills { display: flex; flex-wrap: wrap; gap: 6px; }
        .pill { background: #e2e8f0; color: var(--secondary); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .pill-highlight { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .pill-ai { background: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }

        .edu-item { margin-bottom: 12px; }
        .edu-title { font-weight: 700; color: var(--primary); font-size: 0.92rem; }
        .edu-school { font-size: 0.85rem; color: var(--text-light); }
        .edu-date { font-size: 0.8rem; color: var(--net-color); font-weight: 600; }

        .lang-item { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 6px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 3px; }

        .btn-print { position: fixed; bottom: 30px; right: 30px; background: #0f172a; color: white; padding: 14px 28px; border-radius: 50px; border: none; cursor: pointer; font-weight: 700; font-size: 0.95rem; box-shadow: 0 10px 25px rgba(15,23,42,0.3); display: inline-flex; align-items: center; gap: 10px; transition: all 0.2s ease; z-index: 1000; text-decoration: none; }
        .btn-print:hover { transform: translateY(-2px); background: #1e293b; }

        @media (max-width: 768px) {
            .selector-nav { flex-direction: column; gap: 12px; text-align: center; }
            header { flex-direction: column; text-align: center; padding: 30px 20px; }
            .contact-info { justify-content: center; }
            .main-content { grid-template-columns: 1fr; padding: 25px 20px; }
            .modules-grid { grid-template-columns: 1fr; }
        }

        @page { size: A4 portrait; margin: 5mm; }
        @media print {
            body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; color: #0f172a !important; font-size: 9.5px !important; line-height: 1.3 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .selector-nav, .btn-print { display: none !important; }
            .container { box-shadow: none !important; border-radius: 0 !important; width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; background: #ffffff !important; }
            header { padding: 12px 20px !important; gap: 15px !important; background: #0f172a !important; }
            .profile-img-box { width: 75px !important; height: 75px !important; border-width: 3px !important; }
            .header-text h1 { font-size: 1.45rem !important; margin-bottom: 2px !important; color: #ffffff !important; }
            .header-text h2 { font-size: 0.88rem !important; margin-bottom: 4px !important; }
            .header-title-badge { font-size: 0.65rem !important; padding: 2px 6px !important; margin-bottom: 2px !important; }
            .contact-info { gap: 10px !important; font-size: 0.75rem !important; color: #cbd5e1 !important; }
            .main-content { display: grid !important; grid-template-columns: 1.8fr 1fr !important; gap: 12px !important; padding: 12px 18px !important; }
            .section-title { font-size: 0.85rem !important; margin-bottom: 6px !important; padding-bottom: 2px !important; }
            .experience-item { margin-bottom: 6px !important; }
            .experience-title { font-size: 0.82rem !important; }
            .experience-company { font-size: 0.78rem !important; }
            .experience-date { font-size: 0.72rem !important; }
            .experience-bullets { margin-top: 2px !important; padding-left: 12px !important; font-size: 0.75rem !important; }
            .experience-bullets li { margin-bottom: 2px !important; }
            .modules-grid { gap: 4px !important; margin-top: 4px !important; grid-template-columns: 1fr 1fr !important; }
            .module-box { padding: 4px 6px !important; font-size: 0.72rem !important; }
            .module-box strong { font-size: 0.75rem !important; margin-bottom: 1px !important; }
            .project-card { padding: 8px 10px !important; margin-bottom: 8px !important; }
            .project-card h3 { font-size: 0.82rem !important; margin-bottom: 3px !important; }
            .project-narrative { font-size: 0.73rem !important; line-height: 1.3 !important; margin-bottom: 4px !important; }
            .stack-box { padding: 4px 6px !important; font-size: 0.72rem !important; }
            .skills-group { margin-bottom: 6px !important; }
            .skills-group h4 { font-size: 0.75rem !important; margin-bottom: 2px !important; }
            .skills-pills { gap: 2px !important; }
            .pill { padding: 1px 5px !important; font-size: 0.70rem !important; }
            .edu-item { margin-bottom: 4px !important; }
            .edu-title { font-size: 0.78rem !important; }
            .edu-school { font-size: 0.72rem !important; }
            .edu-date { font-size: 0.68rem !important; }
            .lang-item { font-size: 0.75rem !important; margin-bottom: 2px !important; padding-bottom: 1px !important; }
        }
    </style>
</head>
<body>
